<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d">
  <title id="t">ReinforcedLN architecture</title>
  <desc id="d">Data flows from the MyAnimeList API through the extractor and reducer into a CSV, then through the data loader and SBERT embeddings to an algorithm switch in cli.py. The default PPO path trains an actor-critic on simulated feedback and saves ppo_agent.pt. The online path uses the MLP policy with Good or Bad feedback and saves agent_stats.pth.</desc>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; font-size: 14px; }
    .sub { fill: #8b949e; font-size: 12px; }
    .head { font-size: 16px; }
    .node { fill: #161b22; stroke: #30363d; stroke-width: 1; }
    .focus { stroke: #58a6ff; }
    .out { stroke: #3fb950; }
    .base { fill: none; stroke: #30363d; stroke-width: 2; }
    .flow { fill: none; stroke: #58a6ff; stroke-width: 2; stroke-dasharray: 6 12; animation: flow 2.4s linear infinite; }
    .save { stroke: #3fb950; }
    .s1 { animation-delay: 0s; } .s2 { animation-delay: .3s; } .s3 { animation-delay: .6s; }
    .s4 { animation-delay: .9s; } .s5 { animation-delay: 1.2s; } .s6 { animation-delay: 1.5s; }
    .s7 { animation-delay: 1.8s; } .s8 { animation-delay: 2.1s; }
    @keyframes flow { to { stroke-dashoffset: -72; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; stroke-dasharray: none; } }
  </style>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3fb950"/></marker>
  </defs>
  <rect width="960" height="520" fill="#0d1117"/>
  <text x="30" y="34" class="head">Data preparation, then a PPO path and an online MLP path</text>

  <g marker-end="url(#ab)">
    <path class="base" d="M210 100 H268"/><path class="flow s1" d="M210 100 H268"/>
    <path class="base" d="M450 100 H508"/><path class="flow s2" d="M450 100 H508"/>
    <path class="base" d="M690 100 H748"/><path class="flow s3" d="M690 100 H748"/>
    <path class="base" d="M840 130 V198"/><path class="flow s4" d="M840 130 V198"/>
    <path class="base" d="M750 230 H692"/><path class="flow s5" d="M750 230 H692"/>
    <path class="base" d="M510 230 H452"/><path class="flow s6" d="M510 230 H452"/>
    <path class="base" d="M360 260 V290 H120 V328"/><path class="flow s7" d="M360 260 V290 H120 V328"/>
    <path class="base" d="M360 290 H600 V328"/><path class="flow s7" d="M360 290 H600 V328"/>
    <path class="base" d="M210 360 H268"/><path class="flow s1" d="M210 360 H268"/>
    <path class="base" d="M690 360 H748"/><path class="flow s2" d="M690 360 H748"/>
  </g>
  <g marker-end="url(#ag)">
    <path class="base" d="M360 390 V428"/><path class="flow save s3" d="M360 390 V428"/>
    <path class="base" d="M840 390 V428"/><path class="flow save s4" d="M840 390 V428"/>
  </g>

  <rect class="node" x="30" y="70" width="180" height="60" rx="6"/>
  <text x="120" y="96" text-anchor="middle">MyAnimeList API</text><text x="120" y="115" text-anchor="middle" class="sub">MAL_CLIENT_ID from env</text>
  <rect class="node" x="270" y="70" width="180" height="60" rx="6"/>
  <text x="360" y="96" text-anchor="middle">extractor.py</text><text x="360" y="115" text-anchor="middle" class="sub">fetch light novels</text>
  <rect class="node" x="510" y="70" width="180" height="60" rx="6"/>
  <text x="600" y="96" text-anchor="middle">reducer.py</text><text x="600" y="115" text-anchor="middle" class="sub">reduce to about 2,000</text>
  <rect class="node" x="750" y="70" width="180" height="60" rx="6"/>
  <text x="840" y="96" text-anchor="middle">reduced_light_novels.csv</text><text x="840" y="115" text-anchor="middle" class="sub">2,000 rows</text>

  <rect class="node" x="750" y="200" width="180" height="60" rx="6"/>
  <text x="840" y="226" text-anchor="middle">data_loader.py</text><text x="840" y="245" text-anchor="middle" class="sub">Genres + Synopsis text</text>
  <rect class="node" x="510" y="200" width="180" height="60" rx="6"/>
  <text x="600" y="226" text-anchor="middle">SBERT embeddings</text><text x="600" y="245" text-anchor="middle" class="sub">all-MiniLM-L6-v2</text>
  <rect class="node focus" x="270" y="200" width="180" height="60" rx="6"/>
  <text x="360" y="226" text-anchor="middle">cli.py train</text><text x="360" y="245" text-anchor="middle" class="sub">--algo ppo or online</text>

  <text x="140" y="312" class="sub">PPO path, default</text>
  <text x="612" y="312" class="sub">Online MLP path, --algo online</text>

  <rect class="node focus" x="30" y="330" width="180" height="60" rx="6"/>
  <text x="120" y="356" text-anchor="middle">simulated_user.py</text><text x="120" y="375" text-anchor="middle" class="sub">simulated feedback</text>
  <rect class="node focus" x="270" y="330" width="180" height="60" rx="6"/>
  <text x="360" y="356" text-anchor="middle">ppo_agent.py</text><text x="360" y="375" text-anchor="middle" class="sub">actor-critic, GAE, clipped update</text>
  <rect class="node" x="510" y="330" width="180" height="60" rx="6"/>
  <text x="600" y="356" text-anchor="middle">rl_recommender.py</text><text x="600" y="375" text-anchor="middle" class="sub">MLP policy, Adam on MSE</text>
  <rect class="node" x="750" y="330" width="180" height="60" rx="6"/>
  <text x="840" y="356" text-anchor="middle">Good or Bad feedback</text><text x="840" y="375" text-anchor="middle" class="sub">ui_feedback.py, cli.py</text>

  <rect class="node out" x="270" y="430" width="180" height="60" rx="6"/>
  <text x="360" y="456" text-anchor="middle">ppo_agent.pt</text><text x="360" y="475" text-anchor="middle" class="sub">ppo_training.py</text>
  <rect class="node out" x="750" y="430" width="180" height="60" rx="6"/>
  <text x="840" y="456" text-anchor="middle">agent_stats.pth</text><text x="840" y="475" text-anchor="middle" class="sub">training_log.py</text>

  <text x="30" y="510" class="sub">Weights land in REINFORCEDLN_MODELS_DIR, default models/. main.py and the Gradio UI use the online MLP.</text>
</svg>
